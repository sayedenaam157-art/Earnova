<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earnova</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 20px;
      font-size: 42px;
    }

    .subtitle {
      color: #777;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .points {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .points-title {
      color: #777;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .points-number {
      font-size: 55px;
      font-weight: bold;
    }

    .star {
      font-size: 55px;
    }

    button {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      border: none;
      border-radius: 18px;
      background: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    button:active {
      transform: scale(0.98);
    }

    .reward {
      background: #fff;
    }

    .disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      margin: 15px 0;
      font-weight: bold;
      color: #555;
    }

    footer {
      margin-top: 50px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🎯 Earnova</h1>

    <div class="subtitle">
      Earn points by completing simple tasks.
    </div>

    <div class="points">

      <div class="points-title">
        Your Points
      </div>

      <div>
        <span class="star">⭐</span>
        <span class="points-number" id="points">0</span>
      </div>

    </div>

    <button id="dailyButton" class="reward" onclick="dailyReward()">
      🎁 Daily Reward
    </button>

    <div id="message"></div>

    <button onclick="tasks()">
      📋 Tasks
    </button>

    <button onclick="invite()">
      👥 Invite Friends
    </button>

    <footer>
      © 2026 Earnova
    </footer>

  </div>


  <script>

    // مقدار اولیه امتیاز
    let points = Number(localStorage.getItem("earnova_points")) || 0;

    // نمایش امتیاز
    document.getElementById("points").innerText = points;


    // بررسی آخرین دریافت جایزه
    function checkDailyReward() {

      const lastReward =
        localStorage.getItem("earnova_daily_reward");

      if (!lastReward) {
        return true;
      }

      const today = new Date().toDateString();

      return lastReward !== today;
    }


    // دریافت جایزه روزانه
    function dailyReward() {

      const button =
        document.getElementById("dailyButton");

      const message =
        document.getElementById("message");

      if (!checkDailyReward()) {

        message.innerText =
          "⏳ You already received today's reward.";

        return;
      }


      // اضافه کردن 10 امتیاز
      points += 10;


      // ذخیره امتیاز
      localStorage.setItem(
        "earnova_points",
        points
      );


      // ثبت تاریخ دریافت جایزه
      const today =
        new Date().toDateString();

      localStorage.setItem(
        "earnova_daily_reward",
        today
      );


      // نمایش امتیاز جدید
      document.getElementById("points")
        .innerText = points;


      // پیام موفقیت
      message.innerText =
        "🎉 You received 10 points!";


      // غیرفعال کردن دکمه
      button.classList.add("disabled");
    }


    function tasks() {

      alert(
        "📋 Tasks will be available soon."
      );

    }


    function invite() {

      alert(
        "👥 Referral system will be available soon."
      );

    }


    // هنگام باز شدن صفحه بررسی شود
    if (!checkDailyReward()) {

      document.getElementById("dailyButton")
        .classList.add("disabled");

    }

  </script>

</body>
</html>

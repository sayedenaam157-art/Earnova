<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Earnova</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 20px;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .points {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .points-title {
      color: #777;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .points-number {
      font-size: 55px;
      font-weight: bold;
    }

    .star {
      font-size: 55px;
    }

    button {
      width: 100%;
      padding: 20px;
      margin: 9px 0;
      border: none;
      border-radius: 18px;
      background: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    button:active {
      transform: scale(0.98);
    }

    .disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      margin: 15px 0;
      font-weight: bold;
      color: #555;
    }

    .referral-box {
      display: none;
      background: white;
      padding: 20px;
      margin-top: 10px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .referral-box h3 {
      margin-top: 0;
      font-size: 24px;
    }

    .referral-box p {
      color: #777;
      line-height: 1.5;
    }

    #referralLink {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .task-box {
      display: none;
      background: white;
      padding: 20px;
      margin-top: 10px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .task-box h3 {
      margin-top: 0;
      font-size: 24px;
    }

    .task {
      background: #f2f4f7;
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
      text-align: left;
    }

    footer {
      margin-top: 50px;
      color: #aaa;
    }

  </style>

</head>


<body>

  <div class="app">

    <h1>🎯 Earnova</h1>

    <div class="subtitle">
      Earn points by completing simple tasks.
    </div>


    <!-- POINTS -->

    <div class="points">

      <div class="points-title">
        Your Points
      </div>

      <div>

        <span class="star">⭐</span>

        <span
          class="points-number"
          id="points"
        >
          0
        </span>

      </div>

    </div>


    <!-- DAILY REWARD -->

    <button
      id="dailyButton"
      onclick="dailyReward()"
    >
      🎁 Daily Reward
    </button>


    <div id="message"></div>


    <!-- TASKS -->

    <button onclick="showTasks()">
      📋 Tasks
    </button>


    <div
      id="taskBox"
      class="task-box"
    >

      <h3>📋 Tasks</h3>

      <p>
        Complete tasks and earn more points.
      </p>

      <div class="task">
        🔜 More tasks coming soon...
      </div>

    </div>


    <!-- INVITE -->

    <button onclick="showReferral()">
      👥 Invite Friends
    </button>


    <div
      id="referralBox"
      class="referral-box"
    >

      <h3>👥 Invite Friends</h3>

      <p>
        Invite your friends to Earnova.
      </p>

      <input
        id="referralLink"
        readonly
      >

      <button onclick="copyReferral()">
        📋 Copy Referral Link
      </button>

      <button onclick="shareReferral()">
        📤 Share with Friends
      </button>

    </div>


    <footer>
      © 2026 Earnova
    </footer>

  </div>



  <script>

    /* =========================
       POINTS SYSTEM
    ========================= */

    let points =
      Number(
        localStorage.getItem("earnova_points")
      ) || 0;


    document.getElementById("points")
      .innerText = points;



    /* =========================
       DAILY REWARD
    ========================= */

    function canGetDailyReward() {

      const lastReward =
        localStorage.getItem(
          "earnova_daily_reward"
        );

      if (!lastReward) {
        return true;
      }

      const today =
        new Date().toDateString();

      return lastReward !== today;
    }



    function dailyReward() {

      const button =
        document.getElementById(
          "dailyButton"
        );

      const message =
        document.getElementById(
          "message"
        );


      if (!canGetDailyReward()) {

        message.innerText =
          "⏳ You already received today's reward.";

        return;
      }


      /* Give 10 points */

      points += 10;


      /* Save points */

      localStorage.setItem(
        "earnova_points",
        points
      );


      /* Save today's date */

      const today =
        new Date().toDateString();

      localStorage.setItem(
        "earnova_daily_reward",
        today
      );


      /* Update screen */

      document.getElementById(
        "points"
      ).innerText = points;


      message.innerText =
        "🎉 You received 10 points!";


      button.classList.add(
        "disabled"
      );

    }



    /* =========================
       REFERRAL SYSTEM
    ========================= */

    function getReferralCode() {

      let code =
        localStorage.getItem(
          "earnova_referral_code"
        );


      if (!code) {

        code =
          "earnova_" +
          Math.random()
            .toString(36)
            .substring(2, 10);


        localStorage.setItem(
          "earnova_referral_code",
          code
        );

      }


      return code;

    }



    function showReferral() {

      const box =
        document.getElementById(
          "referralBox"
        );

      const link =
        document.getElementById(
          "referralLink"
        );


      const code =
        getReferralCode();


      const referralLink =
        window.location.origin +
        window.location.pathname +
        "?ref=" +
        code;


      link.value =
        referralLink;


      box.style.display =
        "block";


      document.getElementById(
        "taskBox"
      ).style.display = "none";

    }



    function copyReferral() {

      const link =
        document.getElementById(
          "referralLink"
        );


      navigator.clipboard
        .writeText(link.value)
        .then(function() {

          alert(
            "✅ Referral link copied!"
          );

        })
        .catch(function() {

          alert(
            "Please copy the link manually."
          );

        });

    }



    function shareReferral() {

      const link =
        document.getElementById(
          "referralLink"
        ).value;


      const text =
        "🎯 Join Earnova and earn points!";


      const telegramUrl =
        "https://t.me/share/url?url=" +
        encodeURIComponent(link) +
        "&text=" +
        encodeURIComponent(text);


      window.open(
        telegramUrl,
        "_blank"
      );

    }



    /* =========================
       TASKS
    ========================= */

    function showTasks() {

      const box =
        document.getElementById(
          "taskBox"
        );


      box.style.display =
        "block";


      document.getElementById(
        "referralBox"
      ).style.display = "none";

    }



    /* =========================
       STARTUP CHECK
    ========================= */

    if (!canGetDailyReward()) {

      document.getElementById(
        "dailyButton"
      ).classList.add(
        "disabled"
      );

    }

  </script>

</body>

</html>

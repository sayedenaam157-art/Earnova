<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnova</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 20px;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .points {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .points-title {
      color: #777;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .points-number {
      font-size: 52px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 8px 0;
      border: none;
      border-radius: 17px;
      background: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    button:active {
      transform: scale(0.98);
    }

    .disabled {
      opacity: 0.5;
    }

    #message {
      min-height: 25px;
      margin: 12px 0;
      font-weight: bold;
    }

    .box {
      display: none;
      background: white;
      padding: 20px;
      margin-top: 10px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    #referralLink {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    footer {
      margin-top: 40px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🎯 Earnova</h1>

  <div class="subtitle">
    Earn points by completing tasks.
  </div>

  <div class="points">

    <div class="points-title">
      Your Points
    </div>

    <div>
      ⭐
      <span id="points" class="points-number">0</span>
    </div>

  </div>

  <button id="dailyButton" onclick="dailyReward()">
    🎁 Daily Reward
  </button>

  <div id="message"></div>

  <button onclick="showTasks()">
    📋 Tasks
  </button>

  <div id="tasksBox" class="box">

    <h3>📋 Tasks</h3>

    <p>
      More tasks will be available soon.
    </p>

  </div>

  <button onclick="showReferral()">
    👥 Invite Friends
  </button>

  <div id="referralBox" class="box">

    <h3>👥 Invite Friends</h3>

    <p>
      Invite friends and earn points.
    </p>

    <input id="referralLink" readonly>

    <button onclick="copyReferral()">
      📋 Copy Link
    </button>

    <button onclick="shareReferral()">
      📤 Share on Telegram
    </button>

  </div>

  <footer>
    © 2026 Earnova
  </footer>

</div>


<script>

  /*
    SUPABASE
  */

  const SUPABASE_URL =
    "https://gnlyytftmyvtcksycoxs.supabase.co";

  /*
    اینجا Publishable key خودت را از Supabase بگذار.
    فقط مقدار داخل کوتیشن را عوض کن.
  */

  const SUPABASE_KEY =
    "sb_publishable_Rt5ec6hqvcUwNt-SsEEG0g_sua8iK4f";


  /*
    TELEGRAM
  */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /*
    USER
  */

  let telegramUser = tg.initDataUnsafe?.user;

  let telegramId = "";

  let username = "";


  if (telegramUser) {

    telegramId =
      String(telegramUser.id);

    username =
      telegramUser.username || "";

  } else {

    telegramId =
      "browser_" +
      Math.random()
        .toString(36)
        .substring(2, 10);

    username = "browser_user";

  }


  /*
    REFERRAL FROM URL
  */

  const urlParams =
    new URLSearchParams(
      window.location.search
    );

  const referralCode =
    urlParams.get("ref") || "";


  /*
    API CALL
  */

  async function apiRequest(data) {

    const response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/super-function",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify(data)
        }
      );

    return await response.json();

  }


  /*
    LOAD USER
  */

  async function loadUser() {

    try {

      const result =
        await apiRequest({

          telegram_id:
            telegramId,

          username:
            username,

          referral_code:
            referralCode

        });


      if (
        result.success &&
        result.user
      ) {

        document.getElementById(
          "points"
        ).innerText =
          result.user.points || 0;

        window.currentUser =
          result.user;

        createReferralLink(
          result.user.referral_code
        );

      } else {

        console.log(result);

      }

    } catch (error) {

      console.log(error);

      document.getElementById(
        "message"
      ).innerText =
        "Connection error.";

    }

  }


  /*
    REFERRAL LINK
  */

  function createReferralLink(code) {

    if (!code) return;

    const botUsername =
      "EarnovaRewardBot";

    const link =
      "https://t.me/" +
      botUsername +
      "?startapp=" +
      encodeURIComponent(code);

    document.getElementById(
      "referralLink"
    ).value = link;

  }


  /*
    DAILY REWARD
  */

  async function dailyReward() {

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("dailyButton");

  message.innerText =
    "⏳ Claiming reward...";

  try {

    const result =
      await apiRequest({

        action: "daily_reward",

        telegram_id:
          telegramId,

        username:
          username

      });


    if (result.success) {

      document.getElementById(
        "points"
      ).innerText =
        result.points;

      message.innerText =
        "🎉 You received 10 points!";

      button.classList.add(
        "disabled"
      );

    } else {

      message.innerText =
        "⏳ You already claimed today's reward.";

    }

  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ Something went wrong.";

  }

      }

  }


  /*
    TASKS
  */

  function showTasks() {

    document.getElementById(
      "tasksBox"
    ).style.display =
      "block";

    document.getElementById(
      "referralBox"
    ).style.display =
      "none";

  }


  /*
    REFERRAL
  */

  function showReferral() {

    document.getElementById(
      "referralBox"
    ).style.display =
      "block";

    document.getElementById(
      "tasksBox"
    ).style.display =
      "none";

  }


  /*
    COPY
  */

  function copyReferral() {

    const link =
      document.getElementById(
        "referralLink"
      );

    navigator.clipboard
      .writeText(link.value)
      .then(() => {

        alert(
          "✅ Referral link copied!"
        );

      });

  }


  /*
    TELEGRAM SHARE
  */

  function shareReferral() {

    const link =
      document.getElementById(
        "referralLink"
      ).value;

    const text =
      "🎯 Join Earnova and earn points!";


    const telegramUrl =
      "https://t.me/share/url?url=" +
      encodeURIComponent(link) +
      "&text=" +
      encodeURIComponent(text);


    window.open(
      telegramUrl,
      "_blank"
    );

  }


  /*
    START
  */

  loadUser();

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earnova</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    h1 {
      font-size: 40px;
      margin: 15px 0 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .points {
      background: white;
      border-radius: 24px;
      padding: 28px 20px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .points-title {
      color: #777;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .points-number {
      font-size: 52px;
      font-weight: bold;
    }

    .star {
      font-size: 45px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 17px;
      background: white;
      padding: 18px;
      margin: 8px 0;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .box {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-top: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,.07);
    }

    .box p {
      color: #777;
      line-height: 1.5;
    }

    #referralLink {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    #message {
      min-height: 25px;
      margin: 10px 0;
      font-weight: bold;
    }

    .task {
      background: #f2f4f7;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
    }

    footer {
      color: #aaa;
      margin-top: 35px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🎯 Earnova</h1>

  <div class="subtitle">
    Earn points every day.
  </div>

  <div class="points">

    <div class="points-title">
      Your Points
    </div>

    <div>
      <span class="star">⭐</span>
      <span id="points" class="points-number">0</span>
    </div>

  </div>


  <!-- DAILY REWARD -->

  <button id="dailyButton" onclick="dailyReward()">
    🎁 Daily Reward +10
  </button>

  <div id="message"></div>


  <!-- TASKS -->

  <button onclick="showTasks()">
    📋 Tasks
  </button>

  <div id="tasksBox" class="box">

    <h3>📋 Tasks</h3>

    <div class="task">
      🔜 Tasks will be added soon.
    </div>

  </div>


  <!-- REFERRAL -->

  <button onclick="showReferral()">
    👥 Invite Friends
  </button>

  <div id="referralBox" class="box">

    <h3>👥 Invite Friends</h3>

    <p>
      Invite your friends and earn points.
    </p>

    <input
      id="referralLink"
      readonly
    >

    <button onclick="copyReferral()">
      📋 Copy Referral Link
    </button>

    <button onclick="shareReferral()">
      📤 Share on Telegram
    </button>

  </div>


  <footer>
    © 2026 Earnova
  </footer>

</div>


<script>

  /* =====================================
     SUPABASE
  ===================================== */

  const SUPABASE_URL =
    "https://gnlyytftmyvtcksycoxs.supabase.co";


  /*
    فقط این قسمت را با Publishable Key
    خودت عوض کن.
  */

  const SUPABASE_KEY =
    "sb_publishable_Rt5ec6hqvcUwNt-SsEEG0g_sua8iK4f";


  /* =====================================
     TELEGRAM
  ===================================== */

  const tg =
    window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /* =====================================
     USER
  ===================================== */

  const telegramUser =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
      ? tg.initDataUnsafe.user
      : null;


  let telegramId;

  let username;


  if (telegramUser) {

    telegramId =
      String(telegramUser.id);

    username =
      telegramUser.username || "";

  } else {

    /*
      فقط برای تست خارج از تلگرام
    */

    telegramId =
      "test_" +
      Math.random()
        .toString(36)
        .substring(2, 10);

    username =
      "testuser";

  }


  /* =====================================
     REFERRAL CODE
  ===================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const referralCode =
    params.get("ref") || "";


  /* =====================================
     API
  ===================================== */

  async function apiRequest(data) {

    const response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/super-function",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify(data)
        }
      );


    const result =
      await response.json();


    return result;

  }


  /* =====================================
     LOAD USER
  ===================================== */

  async function loadUser() {

    try {

      const result =
        await apiRequest({

          action: "login",

          telegram_id:
            telegramId,

          username:
            username,

          referral_code:
            referralCode

        });


      if (
        result.success &&
        result.user
      ) {

        document.getElementById(
          "points"
        ).innerText =
          result.user.points || 0;


        createReferralLink(
          result.user.referral_code
        );


        /*
          بررسی Daily Reward
        */

        const today =
          new Date()
            .toISOString()
            .split("T")[0];


        if (
          result.user.last_daily_reward ===
          today
        ) {

          document.getElementById(
            "dailyButton"
          ).disabled = true;

          document.getElementById(
            "dailyButton"
          ).innerText =
            "✅ Reward Claimed Today";

        }

      } else {

        showMessage(
          "❌ Could not load user."
        );

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Connection error."
      );

    }

  }


  /* =====================================
     DAILY REWARD
  ===================================== */

  async function dailyReward() {

    const button =
      document.getElementById(
        "dailyButton"
      );


    button.disabled = true;

    showMessage(
      "⏳ Claiming reward..."
    );


    try {

      const result =
        await apiRequest({

          action:
            "daily_reward",

          telegram_id:
            telegramId,

          username:
            username

        });


      if (result.success) {

        document.getElementById(
          "points"
        ).innerText =
          result.points;


        button.innerText =
          "✅ Reward Claimed Today";


        showMessage(
          "🎉 You received 10 points!"
        );

      } else {

        button.disabled = true;

        showMessage(
          "⏳ You already claimed today's reward."
        );

      }

    } catch (error) {

      console.error(error);

      button.disabled = false;

      showMessage(
        "❌ Connection error."
      );

    }

  }


  /* =====================================
     REFERRAL
  ===================================== */

  function createReferralLink(code) {

    if (!code) {
      return;
    }


    const botUsername =
      "EarnovaRewardBot";


    const link =
      "https://t.me/" +
      botUsername +
      "?startapp=" +
      encodeURIComponent(code);


    document.getElementById(
      "referralLink"
    ).value =
      link;

  }


  function showReferral() {

    document.getElementById(
      "referralBox"
    ).style.display =
      "block";


    document.getElementById(
      "tasksBox"
    ).style.display =
      "none";

  }


  function copyReferral() {

    const link =
      document.getElementById(
        "referralLink"
      ).value;


    navigator.clipboard
      .writeText(link)
      .then(function() {

        showMessage(
          "✅ Referral link copied!"
        );

      })
      .catch(function() {

        alert(
          "Copy the link manually."
        );

      });

  }


  function shareReferral() {

    const link =
      document.getElementById(
        "referralLink"
      ).value;


    const text =
      "🎯 Join Earnova and earn points!";


    const url =
      "https://t.me/share/url?url=" +
      encodeURIComponent(link) +
      "&text=" +
      encodeURIComponent(text);


    window.open(
      url,
      "_blank"
    );

  }


  /* =====================================
     TASKS
  ===================================== */

  function showTasks() {

    document.getElementById(
      "tasksBox"
    ).style.display =
      "block";


    document.getElementById(
      "referralBox"
    ).style.display =
      "none";

  }


  /* =====================================
     MESSAGE
  ===================================== */

  function showMessage(text) {

    document.getElementById(
      "message"
    ).innerText =
      text;

  }


  /* =====================================
     START
  ===================================== */

  loadUser();

</script>

</body>
  </html>
